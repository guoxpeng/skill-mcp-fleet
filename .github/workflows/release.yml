name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package .skill
        run: |
          python3 -c "
          import zipfile, os

          output = 'mcp-fleet.skill'
          EXCLUDE_DIRS = {'.git', '__pycache__', 'node_modules', '.github'}
          EXCLUDE_EXTS = {'.pyc', '.skill'}
          EXCLUDE_FILES = {'.DS_Store', '.gitignore', '.gitattributes', 'README.md'}

          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS]
                  for f in files:
                      if f in EXCLUDE_FILES:
                          continue
                      if any(f.endswith(ext) for ext in EXCLUDE_EXTS):
                          continue
                      filepath = os.path.join(root, f)
                      arcname = 'mcp-fleet/' + filepath[2:] if filepath.startswith('./') else 'mcp-fleet/' + filepath
                      zf.write(filepath, arcname)

          with zipfile.ZipFile(output, 'r') as zf:
              files = zf.namelist()
              print(f'Packaged {len(files)} files into {output}')
              for f in sorted(files):
                  print(f'  {f}')
          "

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version: $VERSION"

      - name: Generate release notes
        id: notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## MCP Fleet ${{ steps.version.outputs.version }}

          ### 安装

          ```bash
          # 方式一：下载 .skill 包解压后安装
          unzip mcp-fleet.skill
          cd mcp-fleet
          sudo bash scripts/install.sh --port 3100

          # 方式二：直接用 install.sh
          curl -fsSL https://raw.githubusercontent.com/guoxpeng/skill-mcp-fleet/main/scripts/install.sh -o install.sh
          sudo bash install.sh --port 3100
          ```

          ### 配对

          ```bash
          # A 生成邀请码
          fleet.py invite

          # B 用邀请码一键安装+自动连接
          bash install.sh --invite <邀请码>
          ```

          ### 包内容
          - SKILL.md (标准 AgentSkill 入口)
          - scripts/ (13 个可执行文件)
          - references/ (3 个参考文档)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MCP Fleet ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: mcp-fleet.skill
          draft: false
          prerelease: false
