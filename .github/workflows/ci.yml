name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Syntax check (compile all)
        run: python3 -m compileall -q scripts/ tests/
      - name: Shell bootstrap syntax
        run: sh -n scripts/install.sh
      - name: Run test suite
        run: python3 -m pytest tests/ -q

  skill-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SKILL.md (Agent Skills spec)
        run: python3 scripts/build_package.py --check
      - name: Build competition package (<=30 files)
        run: python3 scripts/build_package.py --out dist
      - name: Verify package manifest and checksums
        run: |
          python3 - <<'PY'
          import json, hashlib, zipfile, pathlib
          zp = next(pathlib.Path("dist").glob("mcp-fleet-v*.zip"))
          with zipfile.ZipFile(zp) as z:
              names = z.namelist()
              assert any(n.endswith("SKILL.md") for n in names), "package missing SKILL.md"
              manifest = json.loads(z.read("mcp-fleet/MANIFEST.json"))
              assert manifest["file_count"] <= 30, manifest["file_count"]
              for rel, meta in manifest["files"].items():
                  data = z.read("mcp-fleet/" + rel)
                  assert hashlib.sha256(data).hexdigest() == meta["sha256"], rel
          print("package ok:", zp, len(names), "entries")
          PY

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest-cov
        run: pip install pytest pytest-cov
      - name: Run tests with coverage
        run: python3 -m pytest tests/ -q --cov=scripts --cov-report=json --cov-report=term
      - name: Update coverage badge (core proto)
        run: |
          COV=$(python3 -c "import json;d=json.load(open('coverage.json'));print(round(d['files']['scripts/fleet_proto.py']['summary']['percent_covered']))")
          COLOR=$(python3 -c "c=$COV;print('brightgreen' if c>=90 else 'green' if c>=70 else 'yellow' if c>=50 else 'red')")
          printf '{"schemaVersion":1,"label":"core proto coverage","message":"%s%%","color":"%s"}\n' "$COV" "$COLOR" > .github/coverage-badge.json
          cat .github/coverage-badge.json
          if git diff --quiet -- .github/coverage-badge.json; then
            echo "badge unchanged"; exit 0
          fi
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add .github/coverage-badge.json
          git commit -m "chore: update coverage badge [skip ci]"
          git push
